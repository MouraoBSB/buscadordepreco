services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pricewatch_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "true"
      RUN_SEED: "true"
      DB_HOST: db
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
    depends_on:
      - db
    networks:
      - coolify
      - pricewatch_net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.pricewatch-http.entryPoints=http"
      - "traefik.http.routers.pricewatch-http.middlewares=redirect-to-https"
      - "traefik.http.routers.pricewatch-http.rule=Host(`buscador.mgnexus.com.br`)"
      - "traefik.http.routers.pricewatch-https.entryPoints=https"
      - "traefik.http.routers.pricewatch-https.rule=Host(`buscador.mgnexus.com.br`)"
      - "traefik.http.routers.pricewatch-https.tls=true"
      - "traefik.http.routers.pricewatch-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.pricewatch-service.loadbalancer.server.port=80"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pricewatch_worker
    restart: unless-stopped
    command: ["/usr/bin/supervisord", "-c", "/etc/supervisord-worker.conf"]
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "false"
      RUN_SEED: "false"
      DB_HOST: db
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    depends_on:
      - db
      - app
    networks:
      - coolify
      - pricewatch_net

  db:
    image: mysql:8.0
    container_name: pricewatch_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-SecretRootPricewatch2026!}
      MYSQL_DATABASE: ${DB_DATABASE:-pricewatch}
      MYSQL_USER: ${DB_USERNAME:-pricewatch_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-SecretUserPricewatch2026!}
    volumes:
      - pricewatch_mysql_data:/var/lib/mysql
    networks:
      - pricewatch_net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

volumes:
  pricewatch_mysql_data:
    name: pricewatch_mysql_data

networks:
  coolify:
    external: true
  pricewatch_net:
    name: pricewatch_internal
    driver: bridge
